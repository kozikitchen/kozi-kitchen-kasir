<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#b91c1c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<title>Kozi Kitchen Kasir V3.4.3</title>
<style>
:root{--red:#b91c1c;--dark:#111827;--muted:#6b7280;--bg:#f3f4f6;--card:#fff}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--dark)}
header{position:sticky;top:0;z-index:5;background:var(--red);color:#fff;padding:14px 16px;box-shadow:0 2px 8px #0002}
header h1{font-size:20px;margin:0}header small{opacity:.9}
nav{display:flex;gap:8px;padding:10px;background:#fff;position:sticky;top:64px;z-index:4;overflow:auto}
nav button{border:0;background:#eee;padding:9px 12px;border-radius:10px;white-space:nowrap;font-weight:700}
nav button.active{background:var(--red);color:#fff}
main{max-width:1100px;margin:auto;padding:12px}.grid{display:grid;grid-template-columns:1.4fr 1fr;gap:12px}
.card{background:var(--card);border-radius:14px;padding:14px;box-shadow:0 1px 4px #0001;margin-bottom:12px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px}
.item{border:1px solid #e5e7eb;border-radius:12px;padding:10px;background:#fff;text-align:left}
.item b{display:block}.item span{color:var(--red);font-weight:800}.item button{width:100%;margin-top:8px;border:0;border-radius:9px;padding:8px;background:#fee2e2;color:#991b1b;font-weight:700}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.cartrow{padding:9px 0;border-bottom:1px solid #eee}.qty button{border:0;background:#eee;border-radius:7px;padding:5px 9px;margin-left:4px}
input,select{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:9px}
.btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;cursor:pointer}.primary{background:var(--red);color:#fff}.secondary{background:#e5e7eb}.danger{background:#fee2e2;color:#991b1b}
.total{font-size:22px;font-weight:900}.muted{color:var(--muted);font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#fff;border-radius:12px;padding:12px}.stat b{font-size:18px;display:block;margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}
.hidden{display:none!important}.actions{display:flex;gap:7px;flex-wrap:wrap}.notice{background:#fff7ed;border:1px solid #fed7aa;padding:10px;border-radius:10px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}nav{top:61px}header{padding:12px}.menu-grid{grid-template-columns:repeat(2,1fr)}}

/* V3.2.2 responsive layout for portrait and landscape */
html,body{width:100%;min-height:100%;-webkit-text-size-adjust:100%}
@media (orientation:landscape) and (min-width:700px){
  main{max-width:100%}
  .grid{grid-template-columns:minmax(0,1.4fr) minmax(300px,.9fr)}
}
@media (orientation:portrait){
  .grid{grid-template-columns:minmax(0,1fr)}
}


/* V3.3 receipt and discount layout */
.discount-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(100px,.8fr);gap:8px;margin:10px 0}
.receipt-modal{position:fixed;inset:0;background:#0008;z-index:9999;display:flex;align-items:center;justify-content:center;padding:12px}
.receipt-box{background:#fff;color:#111;width:min(430px,100%);max-height:92vh;overflow:auto;border-radius:12px;padding:16px}
.receipt-head{text-align:center;border-bottom:1px dashed #888;padding-bottom:10px;margin-bottom:10px}
.receipt-head img{width:140px;height:100px;object-fit:contain}
.receipt-line{display:flex;justify-content:space-between;gap:12px;margin:6px 0;font-size:13px}
.receipt-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
@media print{body *{visibility:hidden!important}#receiptPrint,#receiptPrint *{visibility:visible!important}#receiptPrint{position:absolute;left:0;top:0;width:var(--receipt-width,72mm);max-width:var(--receipt-width,72mm);margin:0!important;padding:2mm!important;box-shadow:none!important;border-radius:0!important;max-height:none!important;overflow:visible!important}#receiptPrint .receipt-actions{display:none!important}#receiptPrint img{max-width:38mm}@page{margin:2mm}}


/* V3.3.1 receipt layout update */
.receipt-brandline{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:12px;margin:5px 0 8px}
.receipt-phone{font-weight:700;white-space:nowrap;font-size:12px}
.receipt-available{display:flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;border-top:1px solid #999;margin-top:10px;padding-top:8px;font-size:10px}
.receipt-available-label{font-weight:700;margin-right:2px}
.receipt-platform{font-weight:800;white-space:nowrap;display:inline-flex;align-items:center;gap:2px}
.receipt-gofood{color:#e5233f}.receipt-grab{color:#168b45}.receipt-instagram{color:#a832a6}
.receipt-igicon{display:inline-flex;align-items:center;justify-content:center;width:13px;height:13px;border-radius:4px;color:#fff;font-size:10px;background:linear-gradient(45deg,#f9ce34,#ee2a7b,#6228d7)}
@media print{.receipt-brandline{gap:3px}.receipt-phone{font-size:10px}.receipt-available{gap:4px;font-size:9px;padding-top:6px}.receipt-igicon{width:11px;height:11px;font-size:8px}}


/* V3.4.1: selected thermal paper width and report printing */
@media print{
 body.print-report *{visibility:hidden!important}
 body.print-report #laporan,body.print-report #laporan *{visibility:visible!important}
 body.print-report #laporan{position:absolute;left:0;top:0;width:100%;padding:0;margin:0;background:#fff}
 body.print-report #laporan .card{box-shadow:none;border-radius:0;padding:2mm;margin:0}
 body.print-report #laporan .screen-only{display:none!important}
 body.print-report #laporan table{font-size:10px}
 body.print-report #laporan th,body.print-report #laporan td{padding:4px;border-bottom:1px solid #bbb}
 #receiptPrint{width:var(--receipt-width,72mm)!important;max-width:var(--receipt-width,72mm)!important}
 @page{margin:2mm}
}
.report-search{max-width:420px}


/* V3.4.2 financial entries and thermal report printing */
.finance-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.fin-stat{border:1px solid #e5e7eb;border-radius:10px;padding:12px;background:#fff}
.fin-stat span{display:block;color:var(--muted);font-size:13px}.fin-stat b{display:block;font-size:18px;margin-top:5px}
.report-search{max-width:100%;margin:8px 0}
@media print { @page { margin:2mm; } }
</style>
</head>
<body>
<header><h1>🍟 Kozi Kitchen — Kasir V3.4.3</h1><small>Offline • PWA • Data tersimpan di perangkat</small></header>
<nav id="nav"></nav>
<main><div id="receiptLayer" class="hidden"></div>
<section id="kasir" class="page"></section>
<section id="dashboard" class="page hidden"></section>
<section id="laporan" class="page hidden"></section>
<section id="keuangan" class="page hidden"></section>
<section id="stok" class="page hidden"></section>
<section id="menu" class="page hidden"></section>
<section id="backup" class="page hidden"></section>
</main>
<script>
const KEY='kozi_kitchen_v32';
const defaultMenu=[
['Burger',12000,'Burger'],['Hotdog',12000,'Burger'],['Chicken Burger',11000,'Burger'],
['Otak2',2000,'Bakaran'],['Sosis',3000,'Bakaran'],['Fish roll',3000,'Bakaran'],['Bakso sapi',3000,'Bakaran'],['Scalp',3000,'Bakaran'],['Cikhuwa',3000,'Bakaran'],['Dumpling keju',7000,'Bakaran'],['Sosis Jumbo',7000,'Bakaran'],['Otak2 Singapore/Jumbo',10000,'Bakaran'],['Dimsum',12000,'Bakaran'],
['Corndog',10000,'Bakaran'],['HOTANG',7000,'Bakaran'],
['Es Potong',10000,'Ice Cream'],['Ice Cream Cone',3000,'Ice Cream'],['Ice Cream Cup',5000,'Ice Cream'],['Es Cemal-Cemil',7000,'Ice Cream'],['Es Cemil Komplit',13000,'Ice Cream'],
['Fanta & Cola Float',8000,'Fresh & Fizz'],['Emerald Fizz & Ruby Sparkle',8000,'Fresh & Fizz'],['Orange Squash',8000,'Fresh & Fizz'],
['Roti Bakar Coklat Keju',10000,'The Eats'],['Nasi Mentai',15000,'The Eats']
];
let db=JSON.parse(localStorage.getItem(KEY)||'null');
if(!db){db={menu:defaultMenu.map((x,i)=>({id:i+1,name:x[0],price:x[1],cat:x[2],stock:20})),tx:[],settings:{}};save()}
if(!Array.isArray(db.expenses)) db.expenses=[];
if(!db.settings) db.settings={};
save();
let cart=[];
let preferredCat=null;
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function money(n){return new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n)}
function today(){return new Date().toISOString().slice(0,10)}
function nav(){document.getElementById('nav').innerHTML=[['kasir','Kasir'],['dashboard','Dashboard'],['laporan','Laporan'],['keuangan','Keuangan'],['stok','Stok'],['menu','Menu'],['backup','Backup']].map(x=>`<button onclick="show('${x[0]}')">${x[1]}</button>`).join('')}
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));document.getElementById(id).classList.remove('hidden');render(id)}
function render(id){
 if(id==='kasir')renderKasir(); if(id==='dashboard')renderDash(); if(id==='laporan')renderReport(); if(id==='keuangan')renderFinance(); if(id==='stok')renderStock(); if(id==='menu')renderMenu(); if(id==='backup')renderBackup();
}
function cats(){return [...new Set(db.menu.map(x=>x.cat))]}
function renderKasir(){
 let availableCats=cats(); if(!availableCats.includes(preferredCat)) preferredCat=availableCats[0]||null; let catsHtml=availableCats.map(c=>`<option ${c===preferredCat?'selected':''}>${c}</option>`).join('');
 document.getElementById('kasir').innerHTML=`<div class="grid"><div class="card"><div class="row"><h2>Kasir</h2><select id="cat" onchange="renderProducts()">${catsHtml}</select></div><div id="products" class="menu-grid"></div></div><div class="card"><h2>Keranjang</h2><div id="cart"></div><div class="row"><span>Subtotal</span><b id="subtotal">Rp0</b></div><div class="discount-grid"><div><label>Jenis diskon</label><select id="discountType" onchange="calcChange()"><option value="none">Tanpa diskon</option><option value="percent">Persentase (%)</option><option value="amount">Nominal (Rp)</option></select></div><div><label>Nilai diskon</label><input id="discountValue" type="number" min="0" step="1" value="0" oninput="calcChange()"></div></div><div class="row"><span>Diskon</span><b id="discountAmount">Rp0</b></div><div class="row"><span>Total</span><span class="total" id="grand"></span></div><hr><label>Metode pembayaran</label><select id="pay"><option>Cash</option><option>QRIS</option><option>Transfer</option></select><div id="cashbox"><label style="display:block;margin-top:8px">Uang diterima</label><input id="cash" type="number" min="0" oninput="calcChange()"><div class="muted">Kembalian: <b id="change">Rp0</b></div></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="checkout()">Simpan Transaksi</button></div></div>`;
 document.getElementById('pay').onchange=()=>{document.getElementById('cashbox').style.display=document.getElementById('pay').value==='Cash'?'block':'none'};
 renderProducts();renderCart()
}
function renderProducts(){
 let c=document.getElementById('cat').value; preferredCat=c;
 document.getElementById('products').innerHTML=db.menu.filter(x=>x.cat===c).map(x=>`<div class="item"><b>${x.name}</b><span>${money(x.price)}</span><div class="muted">Stok: ${x.stock}</div><button onclick="add(${x.id})" ${x.stock<=0?'disabled':''}>Tambah</button></div>`).join('')
}
function add(id){let m=db.menu.find(x=>x.id===id);if(!m||m.stock<=0)return;let q=cart.find(x=>x.id===id);if(q){if(q.qty<m.stock)q.qty++}else cart.push({id,name:m.name,price:m.price,qty:1});renderCart()}
function renderCart(){
 let el=document.getElementById('cart');if(!cart.length){el.innerHTML='<div class="muted">Belum ada item.</div>';calcChange();return}
 el.innerHTML=cart.map(x=>`<div class="cartrow"><div class="row"><div><b>${x.name}</b><div class="muted">${money(x.price)} × ${x.qty}</div></div><div class="qty"><button onclick="changeQty(${x.id},-1)">−</button><b>${x.qty}</b><button onclick="changeQty(${x.id},1)">+</button><button onclick="removeCart(${x.id})">✕</button></div></div></div>`).join('');calcChange()
}
function changeQty(id,d){let q=cart.find(x=>x.id===id),m=db.menu.find(x=>x.id===id);if(!q)return;q.qty+=d;if(q.qty<=0)cart=cart.filter(x=>x.id!==id);if(q&&q.qty>m.stock)q.qty=m.stock;renderCart()}
function removeCart(id){cart=cart.filter(x=>x.id!==id);renderCart()}
function subtotalCart(){return cart.reduce((s,x)=>s+x.price*x.qty,0)}
function discountInfo(subtotal){let type=document.getElementById('discountType')?.value||'none',raw=Math.max(0,Number(document.getElementById('discountValue')?.value||0));let amount=type==='percent'?Math.round(subtotal*Math.min(100,raw)/100):(type==='amount'?Math.min(subtotal,Math.round(raw)):0);return {type,value:raw,amount,total:Math.max(0,subtotal-amount)}}
function calcChange(){let subTotal=subtotalCart(),d=discountInfo(subTotal),cash=+(document.getElementById('cash')?.value||0);let sub=document.getElementById('subtotal'),disc=document.getElementById('discountAmount'),grand=document.getElementById('grand'),change=document.getElementById('change');if(sub)sub.textContent=money(subTotal);if(disc)disc.textContent=money(d.amount);if(grand)grand.textContent=money(d.total);if(change)change.textContent=money(Math.max(0,cash-d.total))}
function checkout(){
 if(!cart.length)return alert('Keranjang masih kosong.');
 let subtotal=subtotalCart(),d=discountInfo(subtotal),total=d.total,pay=document.getElementById('pay').value,cash=+(document.getElementById('cash')?.value||0);
 if(pay==='Cash'&&cash<total)return alert('Uang diterima kurang.');
 for(const q of cart){let m=db.menu.find(m=>m.id===q.id);if(!m||m.stock<q.qty)return alert('Stok '+q.name+' tidak mencukupi. Periksa stok lalu coba lagi.');}
 cart.forEach(q=>{db.menu.find(m=>m.id===q.id).stock-=q.qty});
 let tx={id:Date.now(),date:new Date().toISOString(),items:cart.map(x=>({...x})),subtotal,discountType:d.type,discountValue:d.value,discount:d.amount,total,payment:pay,cash:pay==='Cash'?cash:total,change:pay==='Cash'?cash-total:0,status:'active'};
 db.tx.push(tx);save();cart=[];renderKasir();showReceipt(tx)
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function showReceipt(tx){if((tx.status||'active')==='cancelled'){alert('Struk tidak dapat dicetak karena transaksi sudah dibatalkan.');return}applyPaperWidth();let layer=document.getElementById('receiptLayer');layer.className='receipt-modal';layer.innerHTML=`<div id="receiptPrint" class="receipt-box"><div class="receipt-head"><img src="./icon-512.png" alt="Logo Kozi Kitchen"><h2 style="margin:4px 0">Kozi Kitchen</h2><div class="receipt-brandline"><span>Struk Transaksi</span><span class="receipt-phone">0896 5318 3616</span></div></div><div class="receipt-line"><span>No. Transaksi</span><b>${tx.id}</b></div><div class="receipt-line"><span>Tanggal</span><span>${new Date(tx.date).toLocaleString('id-ID')}</span></div><hr>${tx.items.map(i=>`<div style="margin:8px 0"><div style="font-size:13px;font-weight:700">${esc(i.name)}</div><div class="receipt-line"><span>${i.qty} × ${money(i.price)}</span><b>${money(i.qty*i.price)}</b></div></div>`).join('')}<hr><div class="receipt-line"><span>Subtotal</span><b>${money(tx.subtotal??tx.items.reduce((s,i)=>s+i.price*i.qty,0))}</b></div><div class="receipt-line"><span>Diskon</span><b>-${money(tx.discount||0)}</b></div><div class="receipt-line" style="font-size:16px"><b>Total</b><b>${money(tx.total)}</b></div><div class="receipt-line"><span>Pembayaran</span><b>${esc(tx.payment)}</b></div>${tx.payment==='Cash'?`<div class="receipt-line"><span>Uang diterima</span><span>${money(tx.cash)}</span></div><div class="receipt-line"><span>Kembalian</span><b>${money(tx.change)}</b></div>`:''}<div class="receipt-available" style="border-top:1px solid #999"><img src="./receipt-footer.png" alt="Available At: GoFood, GrabFood, Instagram Kozi_Kitchen" style="display:block;width:100%;max-width:100%;height:auto;object-fit:contain"></div><div style="text-align:center;font-size:12px;margin-top:8px">Terima kasih sudah berbelanja!<br>Kozi Kitchen</div><div class="receipt-actions"><button class="btn primary" onclick="window.print()">Print Struk</button><button class="btn secondary" onclick="closeReceipt()">Tutup</button></div></div>`}
function applyPaperWidth(){let w=localStorage.getItem('kozi_print_paper')||'80';document.documentElement.style.setProperty('--receipt-width',w==='58'?'50mm':'72mm')}
function closeReceipt(){let l=document.getElementById('receiptLayer');if(l){l.className='hidden';l.innerHTML=''}}
function showReceiptById(id){let tx=db.tx.find(x=>String(x.id)===String(id));if(!tx)return alert('Transaksi tidak ditemukan.');if((tx.status||'active')==='cancelled')return alert('Struk tidak tersedia karena transaksi sudah dibatalkan.');showReceipt(tx)}
function cancelTransaction(id){let tx=db.tx.find(x=>x.id===id);if(!tx)return alert('Transaksi tidak ditemukan.');if((tx.status||'active')==='cancelled')return alert('Transaksi ini sudah dibatalkan.');if(!confirm('Batalkan transaksi ini? Stok item akan dikembalikan dan transaksi tidak dihitung sebagai penjualan.'))return;tx.items.forEach(i=>{let m=db.menu.find(m=>m.id===i.id);if(m)m.stock+=i.qty});tx.status='cancelled';tx.cancelledAt=new Date().toISOString();save();filterReport();alert('Transaksi dibatalkan. Stok telah dikembalikan.')}

function renderDash(){
 let t=today(),tx=db.tx.filter(x=>(x.status||'active')!=='cancelled'&&x.date.slice(0,10)===t),sales=tx.reduce((s,x)=>s+x.total,0),items=tx.reduce((s,x)=>s+x.items.reduce((a,i)=>a+i.qty,0),0),count={};
 tx.forEach(x=>x.items.forEach(i=>count[i.name]=(count[i.name]||0)+i.qty));
 let best=Object.entries(count).sort((a,b)=>b[1]-a[1])[0];
 document.getElementById('dashboard').innerHTML=`<div class="stats"><div class="stat">Penjualan hari ini<b>${money(sales)}</b></div><div class="stat">Transaksi<b>${tx.length}</b></div><div class="stat">Item terjual<b>${items}</b></div><div class="stat">Best seller<b>${best?best[0]:'-'}</b></div></div><div class="card"><h2>Pembayaran hari ini</h2><p>Cash: <b>${money(tx.filter(x=>x.payment==='Cash').reduce((s,x)=>s+x.total,0))}</b></p><p>QRIS: <b>${money(tx.filter(x=>x.payment==='QRIS').reduce((s,x)=>s+x.total,0))}</b></p><p>Transfer: <b>${money(tx.filter(x=>x.payment==='Transfer').reduce((s,x)=>s+x.total,0))}</b></p></div><div class="card"><h2>Stok menipis</h2>${db.menu.filter(x=>x.stock<=5).map(x=>`<p>${x.name}: <b>${x.stock}</b></p>`).join('')||'<span class="muted">Tidak ada.</span>'}</div>`;
}
function renderReport(){
 const paper=localStorage.getItem('kozi_print_paper')||'58';
 document.getElementById('laporan').innerHTML=`<div class="card"><h2>Laporan Transaksi</h2><div class="actions"><div style="min-width:130px;flex:1"><label>Dari tanggal</label><input id="from" type="date" value="${today()}"></div><div style="min-width:130px;flex:1"><label>Sampai tanggal</label><input id="to" type="date" value="${today()}"></div><div style="min-width:150px;flex:1"><label>Ukuran kertas cetak</label><select id="paperSize" onchange="savePaperSize()"><option value="58" ${paper==='58'?'selected':''}>Thermal 58 mm</option><option value="80" ${paper==='80'?'selected':''}>Thermal 80 mm</option></select></div></div><div class="actions" style="margin-top:10px"><button class="btn secondary" onclick="filterReport()">Tampilkan</button><button class="btn primary" onclick="printReport()">Cetak Rekap</button><button class="btn secondary" onclick="csv()">Export CSV</button></div><div class="report-search"><label>Cari nomor transaksi</label><input id="transactionSearch" placeholder="Ketik nomor transaksi..." oninput="filterReport()"></div><div id="reportTable"></div></div>`;filterReport()
}
function savePaperSize(){localStorage.setItem('kozi_print_paper',document.getElementById('paperSize').value)}
function filterReport(){
 const fromEl=document.getElementById('from'),toEl=document.getElementById('to'); if(!fromEl||!toEl)return;
 let a=fromEl.value,b=toEl.value,q=(document.getElementById('transactionSearch')?.value||'').trim().toLowerCase();
 let all=db.tx.filter(x=>q?String(x.id).toLowerCase().includes(q):(x.date.slice(0,10)>=a&&x.date.slice(0,10)<=b));
 let active=all.filter(x=>(x.status||'active')!=='cancelled'),cancelled=all.length-active.length,sales=active.reduce((sum,x)=>sum+(Number(x.total)||0),0);
 document.getElementById('reportTable').innerHTML=`<p><b>${active.length}</b> transaksi aktif • <b>${cancelled}</b> dibatalkan • <b>${money(sales)}</b> penjualan bersih</p><div style="overflow:auto"><table><tr><th>No. Transaksi</th><th>Tanggal</th><th>Pembayaran</th><th>Total</th><th>Status</th><th>Item</th><th>Aksi</th></tr>${all.slice().reverse().map(x=>`<tr><td>${esc(String(x.id))}</td><td>${new Date(x.date).toLocaleString('id-ID')}</td><td>${esc(x.payment)}</td><td>${money(x.total)}</td><td>${(x.status||'active')==='cancelled'?'<b style="color:#b91c1c">DIBATALKAN</b>':'Aktif'}</td><td>${x.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</td><td><div class="actions">${(x.status||'active')==='cancelled'?'<span class="muted">Tidak ada aksi</span>':`<button class="btn secondary" onclick="showReceiptById(${Number(x.id)})">Print Struk</button><button class="btn danger" onclick="cancelTransaction(${Number(x.id)})">Batalkan</button>`}</div></td></tr>`).join('')||'<tr><td colspan="7">Tidak ada transaksi yang cocok.</td></tr>'}</table></div>`
}
function printReport(){
 savePaperSize();let size=document.getElementById('paperSize')?.value||localStorage.getItem('kozi_print_paper')||'58';
 let a=document.getElementById('from').value,b=document.getElementById('to').value,q=(document.getElementById('transactionSearch')?.value||'').trim().toLowerCase();
 let all=db.tx.filter(x=>q?String(x.id).toLowerCase().includes(q):(x.date.slice(0,10)>=a&&x.date.slice(0,10)<=b)).slice().reverse();
 let active=all.filter(x=>(x.status||'active')!=='cancelled'),cancelled=all.length-active.length,sales=active.reduce((sum,x)=>sum+(Number(x.total)||0),0),width=size==='80'? '74mm':'52mm';
 let rows=all.map(x=>`<section class="tx"><b>No. ${esc(String(x.id))}</b><p>${new Date(x.date).toLocaleString('id-ID')}</p><p>Pembayaran: ${esc(x.payment)} • Status: ${(x.status||'active')==='cancelled'?'DIBATALKAN':'Aktif'}</p><p>Item: ${x.items.map(i=>esc(i.name)+' ×'+i.qty).join(', ')}</p><p class="amount">Total: ${money(x.total)}</p></section>`).join('');
 let w=window.open('','_blank','width=480,height=720');if(!w)return alert('Popup cetak diblokir browser. Izinkan popup untuk aplikasi Kozi Kitchen lalu coba lagi.');
 w.document.open();w.document.write(`<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rekap Penjualan Kozi Kitchen</title><style>@page{size:${size}mm auto;margin:2mm}*{box-sizing:border-box}body{font:10px Arial,sans-serif;color:#111;width:${width};max-width:${width};margin:0 auto}h2{font-size:14px;margin:0 0 5px}p{margin:4px 0}.tx{border-bottom:1px dashed #888;padding:5px 0;overflow-wrap:anywhere}.tx p{margin:3px 0;overflow-wrap:anywhere}.amount{font-weight:bold;text-align:right} .summary{border-top:1px dashed #777;border-bottom:1px dashed #777;padding:5px 0;margin:7px 0}@media print{body{width:${width};max-width:${width}}}</style></head><body><h2>Kozi Kitchen</h2><b>Rekap Penjualan</b><p>Periode: ${a} s.d. ${b}</p>${q?`<p>Pencarian nomor: ${esc(q)}</p>`:''}<div class="summary"><p>Transaksi aktif: ${active.length}</p><p>Dibatalkan: ${cancelled}</p><p><b>Total penjualan: ${money(sales)}</b></p></div><div>${rows||'<p>Tidak ada transaksi</p>'}</div><script>window.onload=()=>{setTimeout(()=>window.print(),300)};<\/script></body></html>`);w.document.close()
}
function renderFinance(){
 if(!Array.isArray(db.expenses))db.expenses=[];
 document.getElementById('keuangan').innerHTML=`<div class="card"><h2>Catat Belanja / Pengeluaran</h2><p class="muted">Cukup catat tanggal, nominal, dan keterangan singkat (opsional).</p><div class="actions"><div style="min-width:130px;flex:1"><label>Tanggal</label><input id="expenseDate" type="date" value="${today()}"></div><div style="min-width:150px;flex:1"><label>Nominal pengeluaran (Rp)</label><input id="expenseAmount" type="number" min="1" step="1" placeholder="Contoh: 25000"></div><div style="min-width:180px;flex:2"><label>Keterangan (opsional)</label><input id="expenseNote" placeholder="Contoh: belanja sosis"></div><button class="btn primary" onclick="addExpense()">Simpan Pengeluaran</button></div></div><div class="card"><h2>Total Pendapatan Bersih</h2><div class="actions"><button class="btn secondary" onclick="setFinancePeriod('day')">Harian</button><button class="btn secondary" onclick="setFinancePeriod('week')">Mingguan</button><button class="btn secondary" onclick="setFinancePeriod('month')">Bulanan</button></div><div class="actions" style="margin-top:8px"><div style="min-width:130px;flex:1"><label>Dari tanggal</label><input id="finFrom" type="date" value="${today()}"></div><div style="min-width:130px;flex:1"><label>Sampai tanggal</label><input id="finTo" type="date" value="${today()}"></div><button class="btn secondary" onclick="renderFinanceSummary()">Hitung</button></div><div id="financeSummary" style="margin-top:12px"></div></div><div class="card"><h2>Riwayat Pengeluaran</h2><div id="expenseTable"></div></div>`;
 renderFinanceSummary();renderExpenseTable()
}
function dateLocal(d){let y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function setFinancePeriod(period){let now=new Date(),from=new Date(now);if(period==='week'){let dow=(now.getDay()+6)%7;from.setDate(now.getDate()-dow)}else if(period==='month'){from.setDate(1)}let a=document.getElementById('finFrom'),b=document.getElementById('finTo');a.value=dateLocal(from);b.value=dateLocal(now);renderFinanceSummary()}
function addExpense(){let date=document.getElementById('expenseDate').value,amount=Number(document.getElementById('expenseAmount').value),note=document.getElementById('expenseNote').value.trim();if(!date)return alert('Pilih tanggal pengeluaran.');if(!Number.isFinite(amount)||amount<=0)return alert('Masukkan nominal pengeluaran yang benar.');db.expenses.push({id:Date.now(),date,amount:Math.round(amount),note,createdAt:new Date().toISOString()});save();document.getElementById('expenseAmount').value='';document.getElementById('expenseNote').value='';renderFinanceSummary();renderExpenseTable();alert('Pengeluaran berhasil dicatat.')}
function renderFinanceSummary(){let f=document.getElementById('finFrom'),t=document.getElementById('finTo');if(!f||!t)return;let a=f.value,b=t.value;let sales=db.tx.filter(x=>(x.status||'active')!=='cancelled'&&x.date.slice(0,10)>=a&&x.date.slice(0,10)<=b).reduce((s,x)=>s+(Number(x.total)||0),0);let expenses=(db.expenses||[]).filter(x=>x.date>=a&&x.date<=b).reduce((s,x)=>s+(Number(x.amount)||0),0);let net=sales-expenses;document.getElementById('financeSummary').innerHTML=`<div class="finance-grid"><div class="fin-stat"><span>Total pemasukan penjualan</span><b>${money(sales)}</b></div><div class="fin-stat"><span>Total pengeluaran</span><b>${money(expenses)}</b></div><div class="fin-stat"><span>Pendapatan bersih (pemasukan − pengeluaran)</span><b>${money(net)}</b></div></div><p class="muted">Periode ${a} s.d. ${b}. Transaksi yang dibatalkan tidak dihitung sebagai pemasukan.</p>`}
function renderExpenseTable(){let el=document.getElementById('expenseTable');if(!el)return;let list=(db.expenses||[]).slice().sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);el.innerHTML=`<div style="overflow:auto"><table><tr><th>Tanggal</th><th>Keterangan</th><th>Nominal</th><th>Aksi</th></tr>${list.map(x=>`<tr><td>${x.date}</td><td>${esc(x.note||'—')}</td><td>${money(x.amount)}</td><td><button class="btn danger" onclick="deleteExpense(${x.id})">Hapus</button></td></tr>`).join('')||'<tr><td colspan="4">Belum ada pengeluaran yang dicatat.</td></tr>'}</table></div>`}
function deleteExpense(id){if(!confirm('Hapus catatan pengeluaran ini?'))return;db.expenses=(db.expenses||[]).filter(x=>x.id!==id);save();renderFinanceSummary();renderExpenseTable()}

function renderStock(){document.getElementById('stok').innerHTML=`<div class="card"><h2>Kelola Stok</h2><table><tr><th>Menu</th><th>Stok</th><th>Ubah</th></tr>${db.menu.map(x=>`<tr><td>${x.name}</td><td><b>${x.stock}</b></td><td><button class="btn secondary" onclick="adj(${x.id},10)">+10</button> <button class="btn danger" onclick="setStock(${x.id})">Set</button></td></tr>`).join('')}</table></div>`}
function adj(id,n){db.menu.find(x=>x.id===id).stock+=n;save();renderStock()}
function setStock(id){let m=db.menu.find(x=>x.id===id),n=prompt('Stok baru:',m.stock);if(n!==null&&!isNaN(n)){m.stock=Math.max(0,+n);save();renderStock()}}
function renderMenu(){document.getElementById('menu').innerHTML=`<div class="card"><h2>Menu</h2><div class="actions"><input id="mn" placeholder="Nama menu"><input id="pr" type="number" min="1" placeholder="Harga"><input id="ct" placeholder="Kategori"><input id="st" type="number" min="0" step="1" value="20" placeholder="Stok awal" title="Stok awal (default 20)"><button class="btn primary" onclick="addMenu()">Tambah Menu</button></div><p class="muted">Stok awal otomatis 20 agar menu bisa langsung dijual. Ubah sesuai stok sebenarnya.</p></div><div class="card"><table><tr><th>Menu</th><th>Harga</th><th>Kategori</th><th>Stok</th><th></th></tr>${db.menu.map(x=>`<tr><td>${x.name}</td><td>${money(x.price)}</td><td>${x.cat}</td><td>${x.stock}</td><td><button class="btn danger" onclick="delMenu(${x.id})">Hapus</button></td></tr>`).join('')}</table></div>`}
function addMenu(){let n=document.getElementById('mn').value.trim(),p=Number(document.getElementById('pr').value),c=document.getElementById('ct').value.trim(),rawStock=document.getElementById('st').value,stock=rawStock===''?20:Number(rawStock);if(!n||!Number.isFinite(p)||p<=0||!c)return alert('Lengkapi nama, harga, dan kategori dengan benar.');if(!Number.isInteger(stock)||stock<0)return alert('Stok awal harus berupa angka bulat 0 atau lebih.');db.menu.push({id:Date.now(),name:n,price:p,cat:c,stock});preferredCat=c;save();renderMenu();alert('Menu berhasil ditambahkan. Stok awal: '+stock+'. Saat membuka Kasir, kategori menu baru akan dipilih otomatis.')}
function delMenu(id){if(confirm('Hapus menu ini?')){db.menu=db.menu.filter(x=>x.id!==id);save();renderMenu()}}
function renderBackup(){document.getElementById('backup').innerHTML=`<div class="card"><h2>Backup & Restore</h2><p>Backup menyimpan menu, stok, transaksi, catatan pengeluaran, dan pengaturan dari perangkat ini. File backup otomatis menggunakan ekstensi .json.</p><div class="actions"><button class="btn primary" onclick="backup()">Download Backup JSON</button><label class="btn secondary">Restore JSON <input id="restore" type="file" accept=".json,application/json,.txt,*/*" hidden onchange="restore(this.files[0])"></label><button class="btn danger" onclick="resetAll()">Reset Semua Data</button><button class="btn secondary" onclick="restoreSafetyCopy()">Pulihkan Salinan Pengaman</button></div><div class="notice" style="margin-top:12px"><b>Penting:</b> PWA ini tidak otomatis menyinkronkan data antara HP dan PC. Gunakan Backup JSON saat pindah perangkat.</div><hr><p class="muted">Status instalasi: <span id="installStatus"></span></p><button class="btn secondary" id="installBtn" onclick="installPwa()" style="display:none">📲 Install Kozi Kitchen</button></div>`;document.getElementById('installStatus').textContent=location.protocol==='https:'?'Siap dipasang jika browser mendukung.':'File lokal belum bisa dipasang sebagai PWA. Upload ke HTTPS gratis terlebih dahulu.'}
function backup(){
 try{
  // Keep the existing JSON structure for compatibility with earlier Kozi backups.
  const payload={...db,menu:db.menu,tx:db.tx,expenses:Array.isArray(db.expenses)?db.expenses:[],settings:db.settings||{}};
  const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json;charset=utf-8'});
  const url=URL.createObjectURL(blob),a=document.createElement('a');
  const filename='KoziKitchen_Backup_'+today()+'.json';
  a.href=url;a.download=filename;a.style.display='none';document.body.appendChild(a);a.click();a.remove();
  // Do not revoke immediately; some mobile browsers need a short time to start the download.
  setTimeout(()=>URL.revokeObjectURL(url),1500);
  alert('Backup dibuat dengan nama '+filename+'. Pastikan file sudah tersimpan sebelum menutup aplikasi.');
 }catch(e){alert('Backup belum berhasil dibuat. Pastikan ruang penyimpanan perangkat masih tersedia, lalu coba lagi.');}
}
function restore(f){
 if(!f)return;
 const reader=new FileReader();
 reader.onload=()=>{
  let incoming;
  try{
   incoming=JSON.parse(String(reader.result||''));
   if(!incoming||typeof incoming!=='object'||!Array.isArray(incoming.menu)||!Array.isArray(incoming.tx))throw new Error('format');
   if(incoming.expenses!==undefined&&!Array.isArray(incoming.expenses))throw new Error('expenses');
   if(incoming.settings!==undefined&&(!incoming.settings||typeof incoming.settings!=='object'||Array.isArray(incoming.settings)))throw new Error('settings');
   if(!incoming.menu.every(x=>x&&typeof x==='object')||!incoming.tx.every(x=>x&&typeof x==='object'))throw new Error('records');
  }catch(e){alert('File tidak terbaca sebagai backup Kozi Kitchen yang valid. Data saat ini tidak diubah. Pilih file backup .json (atau file JSON lama yang tidak memiliki ekstensi).');return;}
  if(!confirm('Restore akan mengganti data menu, stok, dan transaksi saat ini dengan isi file backup. Sebelum mengganti, aplikasi akan menyimpan salinan pengaman data saat ini. Lanjutkan?')){const input=document.getElementById('restore');if(input)input.value='';return;}
  const previous=db;
  try{
   // Safety copy in this browser before applying the backup.
   localStorage.setItem(KEY+'_pre_restore_backup',JSON.stringify({savedAt:new Date().toISOString(),data:previous}));
   const restored={...incoming};
   // Older backups may not contain expenses; keep current expenses rather than silently deleting them.
   if(!Array.isArray(restored.expenses))restored.expenses=Array.isArray(previous.expenses)?previous.expenses:[];
   if(!restored.settings||typeof restored.settings!=='object'||Array.isArray(restored.settings))restored.settings=previous.settings||{};
   db=restored;save();
   alert('Restore berhasil. Menu, stok, transaksi, dan catatan pengeluaran dari backup telah diproses. Salinan pengaman data sebelum restore disimpan di perangkat ini.');
   show('dashboard');
  }catch(e){
   db=previous;
   try{localStorage.setItem(KEY,JSON.stringify(previous));}catch(ignore){}
   alert('Restore gagal disimpan karena penyimpanan perangkat bermasalah atau penuh. Data sebelum restore dipertahankan sebisa mungkin; jangan hapus data browser. Coba kosongkan ruang lalu ulangi.');
  }finally{const input=document.getElementById('restore');if(input)input.value='';}
 };
 reader.onerror=()=>alert('File backup gagal dibaca. Coba pilih file sekali lagi.');
 reader.readAsText(f);
}
function restoreSafetyCopy(){
 const raw=localStorage.getItem(KEY+'_pre_restore_backup');
 if(!raw)return alert('Belum ada salinan pengaman restore di perangkat ini.');
 let snapshot;try{snapshot=JSON.parse(raw);if(!snapshot||!snapshot.data||!Array.isArray(snapshot.data.menu)||!Array.isArray(snapshot.data.tx))throw 0;}catch(e){return alert('Salinan pengaman tidak dapat dibaca.');}
 if(!confirm('Pulihkan salinan pengaman yang dibuat sebelum restore pada '+(snapshot.savedAt||'waktu tidak diketahui')+'? Data saat ini akan diganti.'))return;
 const current=db;
 try{db=snapshot.data;save();alert('Salinan pengaman berhasil dipulihkan.');show('dashboard');}
 catch(e){db=current;try{localStorage.setItem(KEY,JSON.stringify(current));}catch(ignore){}alert('Salinan pengaman gagal disimpan. Data saat ini dipertahankan sebisa mungkin.');}
}
function resetAll(){if(confirm('Hapus semua transaksi, stok, dan menu?')){localStorage.removeItem(KEY);location.reload()}}
function csv(){let a=document.getElementById('from').value,b=document.getElementById('to').value,tx=db.tx.filter(x=>(x.status||'active')!=='cancelled'&&x.date.slice(0,10)>=a&&x.date.slice(0,10)<=b),rows=[['Tanggal','Pembayaran','Subtotal','Diskon','Total','Status','Item']];tx.forEach(x=>rows.push([x.date,x.payment,x.subtotal??x.items.reduce((s,i)=>s+i.price*i.qty,0),x.discount||0,x.total,'Aktif',x.items.map(i=>i.name+' x'+i.qty).join(' | ')]));let s=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n'),blob=new Blob([s],{type:'text/csv;charset=utf-8'}),aEl=document.createElement('a');aEl.href=URL.createObjectURL(blob);aEl.download='KoziKitchen_Laporan_'+a+'_'+b+'.csv';aEl.click()}
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;let b=document.getElementById('installBtn');if(b)b.style.display='inline-block'});
async function installPwa(){if(!deferredPrompt)return alert('Jika tombol instal belum muncul, buka aplikasi melalui HTTPS dan gunakan Chrome.');deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}
if('serviceWorker' in navigator && location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
nav();show('kasir');
</script>
